services:
  next:
    restart: unless-stopped
    build:
      context: .
      # A new value from bin/deploy reruns the dependency audit instead of reusing Docker's cache.
      args:
        AUDIT_RUN: ${AUDIT_RUN:-}
    env_file:
      - ./.env
    # The app reads the password from here when DATABASE_URL has none, like the API's container, and the system's private
    # costs (README, Environment) from the costs file; both stay outside the repository.
    volumes:
      - ${PGPASS_FILE:-/dev/null}:/run/secrets/pgpass:ro
      - ${SYSTEM_COSTS_FILE:-/dev/null}:/run/secrets/system-costs.json:ro
    environment:
      - PGPASSFILE=/run/secrets/pgpass
      - SYSTEM_COSTS_FILE=/run/secrets/system-costs.json
    # No published port: only the tunnel container (tesla-next-tunnel), joined to this network, reaches it.
